[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fpaper-export"
version = "0.1.0"
description = "f-paper py文件 snapshot: msbuddy (src) + calibration/NL/train/eval scripts + test data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "lightgbm>=4.2.0",
    "joblib>=1.2.0",
    "scikit-learn>=1.3.0",
    "gdown>=4.7.0",
    "requests>=2.31.0",
    "pandas>=1.2.0",
    "tqdm>=4.65.0",
    "brain-isotopic-distribution>=1.5.14",
    "chemparse>=0.1.2",
    "numba>=0.57.0",
    "statsmodels>=0.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["msbuddy*"]
